

[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
env =
# Database
    POSTGRES_HOST=localhost
    POSTGRES_PORT=5433
    POSTGRES_DB=cinema_test
    POSTGRES_USER=cinema_test_user
    POSTGRES_PASSWORD=cinema_test_password
    DB_ECHO=False
    DB_POOL_SIZE=5
    DB_MAX_OVERFLOW=10
    DB_POOL_TIMEOUT=30

    # JWT
    JWT_SECRET_KEY=test-secret-key-for-testing
    JWT_ALGORITHM=HS256
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
    JWT_REFRESH_TOKEN_EXPIRE_DAYS=7

    # Stripe
    STRIPE_SECRET_KEY=sk_test_fake
    STRIPE_PUBLISHABLE_KEY=pk_test_fake
    STRIPE_WEBHOOK_SECRET=whsec_fake

    # SendGrid
    SENDGRID_API_KEY=SG.fake_key_for_tests
    SENDGRID_FROM_EMAIL=test@test.com

    # Other
    DOMAIN=http://testserver
    ENV=test